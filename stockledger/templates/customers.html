{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block body %}
<div class="row between"><h1>Customers</h1><a class="btn primary" href="{{ url_for('customer_edit') }}">New customer</a></div>
<form class="searchbar"><input name="q" value="{{ text }}" placeholder="Search name or email"><button>Search</button></form>
<div class="tablewrap"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th class="num">Documents</th></tr>
{% for c in rows %}<tr><td><a href="{{ url_for('customer_edit', cid=c.id) }}">{{ c.name }}</a></td><td>{{ c.email or '' }}</td><td>{{ c.phone or '' }}</td><td class="num">{{ c.docs }}</td></tr>
{% else %}<tr><td colspan="4" class="muted">No customers yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
